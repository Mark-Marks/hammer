name = "marked/hammer"
version = "0.3.3"
description = "A set of utilities for Jecs"
authors = ["marked"]
repository = "https://github.com/Mark-Marks/hammer"
license = "MIT"
includes = ["lib", "lib/**", "LICENSE", "pesde.toml", "README.md", "CHANGELOG.md", "jecs.luau"]

[engines]
pesde = "^0.7.3"
lune = "^0.10.4"

[target]
environment = "luau"
lib = "lib/init.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[dependencies]
jecs = { name = "marked/jecs", version = "^0.11.0" }
